apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cerberus

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - retention-cronjob.yaml

images:
  - name: cerberus-ai
    newName: ghcr.io/cerberus-ai/cerberus-ai
    newTag: "0.1.0"

commonLabels:
  app.kubernetes.io/part-of: cerberus-system
  app.kubernetes.io/managed-by: kustomize
