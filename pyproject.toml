[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus-ai"
version = "1.4.0"
description = "cerberus</> - Autonomous Multi-Agent Code Review & Quality Assurance System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cerberus Team" }
]
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "langchain>=0.1.0,<2.0.0",
    "langgraph>=0.0.30,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "redis>=5.0.0,<9.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "rich>=13.7.0,<15.0.0",
    "typer>=0.9.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "websockets>=12.0,<18.0",
    "python-multipart>=0.0.9,<1.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-typescript>=0.21.0; python_version < '3.13'",
    "tree-sitter-go>=0.21.0; python_version < '3.13'",
    "tree-sitter-rust>=0.21.0; python_version < '3.13'",
    "tree-sitter-python>=0.21.0; python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
cerberus = "cerberus.cli.main:app"
codevault = "cerberus.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cerberus*"]
exclude = ["tests*", "demo*", "assets*", "scratch*", "brag-output*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".git", "tests/performance"]
filterwarnings = [
    "ignore:.*'click\\.utils.*' is deprecated.*:DeprecationWarning",
    "ignore:.*'click\\.utils.*' is deprecated.*:PendingDeprecationWarning",
    "ignore:.*Using `httpx` with `starlette\\.testclient` is deprecated.*:Warning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "assets",
    "brag-output",
    "demo",
    "cerberus/web",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "G",   # flake8-logging-format
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "UP006", # use dict instead of Dict (type annotations compatibility)
    "UP035", # deprecated imports from typing
    "UP042", # class inherits from both str and enum.Enum
    "UP045", # Optional[T] vs T | None
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_configs = true
exclude = [
    "^cerberus/web/",
    "^demo/",
    "^assets/",
]

[[tool.mypy.overrides]]
module = [
    "tree_sitter",
    "tree_sitter_python",
    "tree_sitter_typescript",
    "tree_sitter_go",
    "tree_sitter_rust",
    "opentelemetry.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "cerberus/web",
    "demo",
    "assets",
]
skips = [
    "B101", # assert
    "B104", # hardcoded_bind_all_interfaces (needed for container serve)
    "B110", # try_except_pass
]

[tool.coverage.run]
branch = true
source = ["cerberus"]
omit = [
    "cerberus/web/*",
    "cerberus/__main__.py",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
