name: CI Pipeline

on:
  push:
    branches: [ "main", "MZ-Main", "master", "hardening/**" ]
  pull_request:
    branches: [ "main", "MZ-Main", "master" ]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-static-analysis:
    name: Lint, Format, Types & Static Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01d3ab981bc87a # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting, Typing & Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit mypy semgrep
          pip install -r requirements-lock.txt

      - name: Ruff Linter Check
        run: |
          ruff check cerberus/

      - name: Ruff Formatter Check
        run: |
          ruff format --check cerberus/

      - name: Mypy Static Type Verification
        run: |
          mypy cerberus/

      - name: Bandit AST Security Analysis
        run: |
          bandit -r cerberus/ -c pyproject.toml

      - name: Semgrep Policy Security Scan
        run: |
          semgrep scan --config semgrep.yaml --error cerberus/

  security-and-supply-chain:
    name: Dependency Audit, Trivy, Secret Scan & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01d3ab981bc87a # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit cyclonedx-bom

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements-lock.txt

      - name: Filesystem Security Scan (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@a2ca10c3b2f6efad0544f5fb2b339f4ff8d927d6 # v3.88.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements-lock.txt -o sbom.json

      - name: Upload SBOM Security Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: cerberus-cyclonedx-sbom
          path: sbom.json
          retention-days: 30

  kubernetes-validation:
    name: Kubernetes Manifest & Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up kubectl & Kustomize
        uses: azure/setup-kubectl@3e0c5de189cb6a6bc373ec7303570743e339e070 # v4.0.0

      - name: Validate Kustomize Build
        run: |
          kubectl kustomize k8s/

      - name: Validate Kubernetes Manifests (Dry-Run Apply)
        run: |
          kubectl apply --dry-run=client -k k8s/

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint-and-static-analysis, security-and-supply-chain]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.10-alpine
        env:
          POSTGRES_USER: cerberus
          POSTGRES_PASSWORD: cerberus_ci_test_password
          POSTGRES_DB: cerberus_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01d3ab981bc87a # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pytest pytest-asyncio pytest-cov httpx playwright
          pip install -e .

      - name: Install Playwright Browsers
        if: matrix.python-version == '3.11'
        run: |
          playwright install --with-deps chromium

      - name: Syntax & Import Sanity Check
        run: |
          python -m compileall cerberus tests

      - name: Run Test Suite with Branch Coverage Enforcement
        env:
          ENVIRONMENT: testing
          LLM_PROVIDER: heuristic
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://cerberus:cerberus_ci_test_password@localhost:5432/cerberus_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v --tb=short --cov=cerberus --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-verification:
    name: Docker Build, Trivy & Compose Smoke Test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Docker Image
        uses: docker/build-push-action@4f58ea79222b3b150c895db3437bb9ee1834d5b4 # v6.9.0
        with:
          context: .
          push: false
          tags: cerberus-ai:ci-test

      - name: Scan Built Docker Image (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: 'cerberus-ai:ci-test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Real Docker Compose Startup Smoke Test
        env:
          SECRET_KEY: cerberus_dev_secret_key_change_in_production_32chars
          DB_PASSWORD: cerberus_dev_password_do_not_use_in_prod
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
          echo "Waiting for services to become healthy..."
          timeout 90 bash -c 'until curl -sf http://localhost:8000/api/v1/ready; do sleep 2; done'
          echo "Service is ready! Verifying authentication..."
          HTTP_ANON=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/review -X POST -H "Content-Type: application/json" -d '{"code":"x=1"}')
          [ "$HTTP_ANON" -eq 401 ]
          HTTP_AUTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/review -X POST -H "Content-Type: application/json" -H "Authorization: Bearer cvai_dev_key_123" -d '{"code":"x=1","filename":"test.py","language":"python"}')
          [ "$HTTP_AUTH" -eq 200 ]
          echo "Clean shutdown of Compose services..."
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318edeed2796c01d3ab981bc87a # v5.3.0
        with:
          python-version: "3.11"

      - name: Install requirements for smoke test
        run: |
          pip install -r requirements-lock.txt
          pip install httpx

      - name: Execute Deployment Smoke Test Script
        run: |
          python scripts/test_deployment_smoke.py
