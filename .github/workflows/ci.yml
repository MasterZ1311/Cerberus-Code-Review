name: CI Pipeline

on:
  push:
    branches: [ "main", "MZ-Main", "master", "hardening/**" ]
  pull_request:
    branches: [ "main", "MZ-Main", "master" ]

jobs:
  lint-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
          pip install -r requirements.txt
          pip install -e .

      - name: Ruff Linter Check
        run: |
          ruff check cerberus/ --select E,F,W --ignore E501,E722 || true

      - name: Bandit AST Security Analysis
        run: |
          bandit -r cerberus/ -x cerberus/web/ -ll -ii || true

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint-and-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -e .

      - name: Syntax & Import Sanity Check
        run: |
          python -m compileall cerberus tests

      - name: Run Test Suite
        env:
          ENVIRONMENT: testing
          LLM_PROVIDER: heuristic
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cerberus-ai:ci-test
