name: Performance Regression Benchmarking

on:
  pull_request:
    branches: [ "main", "MZ-Main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-latency-and-cache:
    name: Latency SLO & Cache Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Execute Automated Performance Benchmark
        env:
          ENVIRONMENT: testing
          LLM_PROVIDER: heuristic
        run: |
          python tests/performance/benchmark_review.py
