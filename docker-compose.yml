version: '3.8'

# =========================================================================
# Cerberus Multi-Agent Platform - Production Docker Compose Definition
# Strict production security: All secrets must be explicitly provided via environment.
# For local development with zero-setup defaults, use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =========================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cerberus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required (min 32 characters)}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-cerberus}:${DB_PASSWORD:?DB_PASSWORD environment variable is required}@db:5432/${DB_NAME:-cerberus_db}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_ENABLED=true
      - LLM_PROVIDER=${LLM_PROVIDER:-heuristic}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ENABLED_AGENTS=security,performance,quality,architecture,compliance
      - RETAIN_SOURCE_CODE=${RETAIN_SOURCE_CODE:-false}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cerberus-network

  db:
    image: postgres:15.10-alpine
    container_name: cerberus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cerberus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      POSTGRES_DB: ${DB_NAME:-cerberus_db}
    # Security: Database is isolated within private internal bridge network; not exposed to host 0.0.0.0
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cerberus} -d ${DB_NAME:-cerberus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cerberus-network

  redis:
    image: redis:7.4.2-alpine
    container_name: cerberus-redis
    restart: unless-stopped
    # Security: Redis cache is isolated within private internal bridge network; not exposed to host 0.0.0.0
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    volumes:
      - redis_data:/data
    networks:
      - cerberus-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cerberus-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
    networks:
      - cerberus-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cerberus-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cerberus-network

networks:
  cerberus-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
